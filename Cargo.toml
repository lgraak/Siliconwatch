[package]
name = "siliconwatch"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.85"
description = "Read-only Linux hwmon monitoring with best-effort source identity"
license = "GPL-3.0-only"
repository = "https://github.com/lgraak/Siliconwatch"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4.5", default-features = false, features = ["iterator"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[workspace]
members = ["gui"]
exclude = ["vendor/fontdue-0.9.5"]
default-members = ["."]
resolver = "3"

[patch.crates-io]
fontdue = { path = "vendor/fontdue-0.9.5" }
