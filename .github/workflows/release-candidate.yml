name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version, including v
        type: string
        required: true
        default: v0.1.0-alpha.2

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected source and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REPOSITORY" = lgraak/Siliconwatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/check_release_version.py "$VERSION"

  policy:
    needs: preflight
    uses: ./.github/workflows/release-policy.yml
    secrets:
      RELEASE_POLICY_READER: ${{ secrets.RELEASE_POLICY_READER }}

  quality:
    needs: preflight
    uses: ./.github/workflows/alpha1.yml

  source:
    needs: policy
    if: github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: release-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare exact corresponding source and distribution notices
        env:
          VERSION: ${{ inputs.version }}
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 fetch --locked
          python3 scripts/source_release/prepare.py --source . --commit "$GITHUB_SHA" \
            --version "${VERSION#v}" --output "$RUNNER_TEMP/source"
      - name: Encrypt source inputs
        env:
          CANDIDATE_KEY: ${{ secrets.CANDIDATE_KEY }}
        run: python3 scripts/release/envelope.py pack "$RUNNER_TEMP/source" "$RUNNER_TEMP/source.gpg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: ${{ runner.temp }}/source.gpg
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 0

  package:
    needs: source
    if: github.run_attempt == '1'
    environment: release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: ${{ runner.temp }}
      - name: Unpack verified source inputs
        env:
          CANDIDATE_KEY: ${{ secrets.CANDIDATE_KEY }}
        run: python3 scripts/release/envelope.py unpack "$RUNNER_TEMP/source.gpg" "$RUNNER_TEMP/source"
      - name: Build the package and install-test its exact bytes in fresh containers
        env:
          DISTRO: ${{ matrix.distro }}
          VERSION: ${{ inputs.version }}
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          work="$RUNNER_TEMP/native"
          mkdir -p "$work"
          bash packaging/linux/run-native.sh build "$DISTRO" "$VERSION" "$GITHUB_SHA" "$work" "$RUNNER_TEMP/source" \
            2>&1 | tee "$RUNNER_TEMP/build-$DISTRO.log"
          runtimes=("$DISTRO")
          if [[ "$DISTRO" == debian ]]; then runtimes+=(ubuntu); fi
          for runtime in "${runtimes[@]}"; do
            bash packaging/linux/run-native.sh verify "$runtime" "$VERSION" "$GITHUB_SHA" "$work" \
              2>&1 | tee "$RUNNER_TEMP/install-$runtime.log"
          done
          mv "$RUNNER_TEMP/build-$DISTRO.log" "$RUNNER_TEMP"/install-*.log "$work/"
      - name: Encrypt package and verification evidence
        env:
          CANDIDATE_KEY: ${{ secrets.CANDIDATE_KEY }}
        run: python3 scripts/release/envelope.py pack "$RUNNER_TEMP/native" "$RUNNER_TEMP/native.gpg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.distro }}
          path: ${{ runner.temp }}/native.gpg
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 0

  seal:
    needs: [quality, source, package]
    if: github.run_attempt == '1'
    environment: release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/inputs
      - name: Verify the candidate and record its review digest
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_KEY: ${{ secrets.CANDIDATE_KEY }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          bash .github/scripts/seal_candidate.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ inputs.version }}
          path: ${{ runner.temp }}/candidate.tar.gpg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
