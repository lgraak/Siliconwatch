name: Alpha 1 CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.85.0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      RUST_TEST_NOCAPTURE: '1'
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the declared minimum Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build the fixture executable
        run: cargo +1.85.0 build --release --locked --target-dir target/provider-latency
      - name: Python diagnostic fixtures
        timeout-minutes: 5
        run: |
          test -x target/provider-latency/release/siliconwatch
          python3 -B - <<'PY'
          import sys
          import unittest

          print(f"Python: {sys.version}", flush=True)
          if sys.version_info < (3, 11):
              raise SystemExit("Python 3.11 or newer is required")

          suite = unittest.defaultTestLoader.discover("scripts/tests", pattern="test_*.py")

          def test_ids(tests):
              for test in tests:
                  if isinstance(test, unittest.TestSuite):
                      yield from test_ids(test)
                  else:
                      yield test.id()

          identifiers = set(test_ids(suite))
          required_modules = {
              "test_measure_overhead",
              "test_measure_provider_latency",
              "test_overhead_orchestration",
              "test_overhead_process",
              "test_overhead_provenance",
              "test_overhead_results",
              "test_provider_results",
              "test_provider_selection",
          }
          required_cli_tests = {
              "test_provider_selection.CliAliasTests." + name
              for name in (
                  "test_fixture_alias_preserves_raw_values_order_errors_and_identity",
                  "test_isolation_exposes_collision_context_difference_without_rewriting_candidates",
                  "test_root_layout_can_change_identity_meaning_and_must_be_reported",
                  "test_existing_table_and_sampling_json_lines_use_unchanged_contract",
              )
          }
          missing_modules = required_modules - {name.split(".")[0] for name in identifiers}
          missing_cli_tests = required_cli_tests - identifiers
          if suite.countTestCases() < 139 or missing_modules or missing_cli_tests:
              raise SystemExit(
                  f"Incomplete discovery: {suite.countTestCases()} tests; "
                  f"missing modules={sorted(missing_modules)}; "
                  f"missing CLI tests={sorted(missing_cli_tests)}"
              )

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print(f"CI rejects {len(result.skipped)} skipped test(s)", file=sys.stderr)
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY

  dco:
    name: DCO signoffs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out contribution history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the DCO checker
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify every contribution commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B .github/scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"
