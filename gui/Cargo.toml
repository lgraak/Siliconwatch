[package]
name = "siliconwatch-gui"
default-run = "siliconwatch-gui"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Native read-only SiliconWatch sensor client"
license = "GPL-3.0-only"

[features]
ui-verification = ["dep:image"]

[[bin]]
name = "siliconwatch-native-check"
path = "src/bin/native_check.rs"
required-features = ["ui-verification"]

[dependencies]
slint = { version = "=1.13.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2.191"
toml = "=0.8.23"
image = { version = "=0.25.9", default-features = false, features = ["png"], optional = true }

zbus = { version = "=5.13.2", default-features = false, features = ["async-io"] }
futures-lite = "=2.6.1"
async-io = "=2.6.0"
async-channel = "=2.5.0"

[build-dependencies]
slint-build = "=1.13.1"
